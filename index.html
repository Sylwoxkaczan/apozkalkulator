<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator punktów na studia strażackie</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 500px;
  margin: 20px auto;
  padding: 10px;
}
h1 {
  text-align: center;
  font-size: 24px;
}
label {
  margin-top: 10px;
  display: block;
}
input[type="number"], select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  font-size: 16px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 4px;
}
button {
  margin-top: 20px;
  padding: 10px;
  width: 100%;
  font-size: 18px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
}
button:hover {
  background-color: #0056b3;
}
.result {
  margin-top: 20px;
  padding: 10px;
  border: 1px solid #007bff;
  border-radius: 5px;
  background-color: #f0f8ff;
  white-space: pre-line;
}
.error {
  color: red;
  margin-top: 10px;
}

/* mały odstęp pomiędzy selectem a powiązanym inputem */
.select-with-input {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.small-note {
  font-size: 12px;
  color: #666;
}
</style>
</head>
<body>

<h1>Kalkulator punktów na studia strażackie</h1>

<form id="calcForm" onsubmit="return false;">

  <h2>Matematyka</h2>
  <label>Podstawowa (%):</label>
  <input type="number" id="mathBasic" min="0" max="100" placeholder="0-100">

  <label>Rozszerzona:</label>
  <div class="select-with-input">
    <select id="mathAdvancedSelect" onchange="toggleCustomInput('mathAdvancedSelect','mathAdvancedInput')">
      <option value="">-- Brak --</option>
      <option value="custom">Wpisz procent...</option>
    </select>
    <input type="number" id="mathAdvancedInput" min="0" max="100" placeholder="Procent (0-100)" disabled>
    <div class="small-note">Wybierz "-- Brak --" jeśli nie zdawałeś/zdawałaś rozszerzenia. Wybierz "Wpisz procent..." aby wpisać wynik.</div>
  </div>

  <h2>Język obcy</h2>
  <label>Podstawowy (%):</label>
  <input type="number" id="langBasic" min="0" max="100" placeholder="0-100">

  <label>Rozszerzony:</label>
  <div class="select-with-input">
    <select id="langAdvancedSelect" onchange="toggleCustomInput('langAdvancedSelect','langAdvancedInput')">
      <option value="">-- Brak --</option>
      <option value="custom">Wpisz procent...</option>
    </select>
    <input type="number" id="langAdvancedInput" min="0" max="100" placeholder="Procent (0-100)" disabled>
  </div>

  <label>Dwujęzyczny:</label>
  <div class="select-with-input">
    <select id="langBilingualSelect" onchange="toggleCustomInput('langBilingualSelect','langBilingualInput')">
      <option value="">-- Brak --</option>
      <option value="custom">Wpisz procent...</option>
    </select>
    <input type="number" id="langBilingualInput" min="0" max="100" placeholder="Procent (0-100)" disabled>
  </div>

  <h2>Przedmioty dodatkowe</h2>

  <label>Przedmiot dodatkowy 1:</label>
  <select class="extraSubject" onchange="updateOptions()">
    <option value="">-- Brak --</option>
    <option value="fizyka">Fizyka</option>
    <option value="chemia">Chemia</option>
    <option value="informatyka">Informatyka</option>
    <option value="biologia">Biologia</option>
  </select>
  <input type="number" class="extraScore" min="0" max="100" placeholder="Procent" disabled>

  <label>Przedmiot dodatkowy 2:</label>
  <select class="extraSubject" onchange="updateOptions()">
    <option value="">-- Brak --</option>
    <option value="fizyka">Fizyka</option>
    <option value="chemia">Chemia</option>
    <option value="informatyka">Informatyka</option>
    <option value="biologia">Biologia</option>
  </select>
  <input type="number" class="extraScore" min="0" max="100" placeholder="Procent" disabled>

  <label>Przedmiot dodatkowy 3:</label>
  <select class="extraSubject" onchange="updateOptions()">
    <option value="">-- Brak --</option>
    <option value="fizyka">Fizyka</option>
    <option value="chemia">Chemia</option>
    <option value="informatyka">Informatyka</option>
    <option value="biologia">Biologia</option>
  </select>
  <input type="number" class="extraScore" min="0" max="100" placeholder="Procent" disabled>

  <label>Przedmiot dodatkowy 4:</label>
  <select class="extraSubject" onchange="updateOptions()">
    <option value="">-- Brak --</option>
    <option value="fizyka">Fizyka</option>
    <option value="chemia">Chemia</option>
    <option value="informatyka">Informatyka</option>
    <option value="biologia">Biologia</option>
  </select>
  <input type="number" class="extraScore" min="0" max="100" placeholder="Procent" disabled>

  <button type="button" onclick="calculatePoints()">Oblicz punkty</button>
</form>

<div class="error" id="errorMsg"></div>
<div class="result" id="result"></div>

<script>
const weights = {
  matematyka: 1.0,
  jezyk: 0.5,
  chemia: 0.8,
  fizyka: 0.9,
  biologia: 0.6,
  informatyka: 0.7
};

// Funkcja aktywująca pole procentowe i blokująca duplikaty dla przedmiotów dodatkowych
function updateOptions() {
  const selects = document.querySelectorAll('.extraSubject');
  const scores = document.querySelectorAll('.extraScore');
  let chosen = [];

  selects.forEach((sel, i) => {
    scores[i].disabled = sel.value === "";
    chosen[i] = sel.value;
  });

  selects.forEach((sel, i) => {
    const currentValue = sel.value;
    for (let option of sel.options) {
      if (option.value !== "" && chosen.includes(option.value) && option.value !== currentValue) {
        option.disabled = true;
      } else {
        option.disabled = false;
      }
    }
  });
}

// Włącza/wyłącza powiązane pole input przy wybraniu "Wpisz procent..."
function toggleCustomInput(selectId, inputId) {
  const sel = document.getElementById(selectId);
  const input = document.getElementById(inputId);
  if (!sel || !input) return;
  input.disabled = sel.value !== 'custom';
  if (input.disabled) {
    input.value = "";
  } else {
    input.focus();
  }
}

function validatePercent(value) {
  return !(isNaN(value) || value < 0 || value > 100);
}

function calculatePoints() {
  document.getElementById("errorMsg").innerText = "";
  document.getElementById("result").innerText = "";

  // Matematyka
  const mathBasic = parseFloat(document.getElementById("mathBasic").value) || 0;

  const mathAdvSel = document.getElementById("mathAdvancedSelect").value;
  const mathAdvancedInput = document.getElementById("mathAdvancedInput").value;
  let mathAdvanced = 0;
  if (mathAdvSel === 'custom') {
    mathAdvanced = parseFloat(mathAdvancedInput);
    if (!validatePercent(mathAdvanced)) {
      document.getElementById("errorMsg").innerText = "Proszę wpisać poprawny wynik dla matematyki rozszerzonej (0-100).";
      return;
    }
  }

  const mathPoints = Math.max(mathBasic * 0.5, mathAdvanced * 1.0) * weights.matematyka;

  // Język obcy
  const langBasic = parseFloat(document.getElementById("langBasic").value) || 0;

  const langAdvSel = document.getElementById("langAdvancedSelect").value;
  const langAdvancedInput = document.getElementById("langAdvancedInput").value;
  let langAdvanced = 0;
  if (langAdvSel === 'custom') {
    langAdvanced = parseFloat(langAdvancedInput);
    if (!validatePercent(langAdvanced)) {
      document.getElementById("errorMsg").innerText = "Proszę wpisać poprawny wynik dla języka obcego (rozszerzony) (0-100).";
      return;
    }
  }

  const langBilSel = document.getElementById("langBilingualSelect").value;
  const langBilingualInput = document.getElementById("langBilingualInput").value;
  let langBilingual = 0;
  if (langBilSel === 'custom') {
    langBilingual = parseFloat(langBilingualInput);
    if (!validatePercent(langBilingual)) {
      document.getElementById("errorMsg").innerText = "Proszę wpisać poprawny wynik dla języka dwujęzycznego (0-100).";
      return;
    }
  }

  const langPoints = Math.max(
    langBasic * 0.5,
    langAdvanced * 1.0,
    langBilingual * 1.4
  ) * weights.jezyk;

  // Przedmioty dodatkowe
  const selects = document.querySelectorAll('.extraSubject');
  const scores = document.querySelectorAll('.extraScore');
  let extraPointsArray = [];

  for (let i = 0; i < selects.length; i++) {
    const subj = selects[i].value;
    if(subj !== "") {
      const score = parseFloat(scores[i].value);
      if(isNaN(score) || score < 0 || score > 100) {
        document.getElementById("errorMsg").innerText = "Proszę wpisać poprawny wynik dla " + subj + " (0-100).";
        return;
      }
      extraPointsArray.push({subject: subj, points: score * weights[subj]});
    }
  }

  let extraPoints = 0;
  let bestExtra = "";
  if(extraPointsArray.length > 0) {
    extraPointsArray.sort((a,b) => b.points - a.points);
    bestExtra = extraPointsArray[0].subject;
    extraPoints = extraPointsArray[0].points;
  }

  const total = mathPoints + langPoints + extraPoints;

  let resultText = `Punkty z matematyki: ${mathPoints.toFixed(2)}\n`;
  resultText += `Punkty z języka obcego: ${langPoints.toFixed(2)}\n`;
  if(bestExtra !== "") resultText += `Punkty z ${bestExtra}: ${extraPoints.toFixed(2)}\n`;
  resultText += `Łączna liczba punktów: ${total.toFixed(2)}`;

  document.getElementById("result").innerText = resultText;
}
</script>

</body>
</html>
